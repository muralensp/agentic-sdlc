# The built-in base profile: safe defaults that apply to every project (PRD 2b, FR-41).
# Stack profiles (dotnet, python) extend this one and add their own commands.

board:
  path: docs/WORK-ITEMS.md
  briefs: docs/work-items
  code: null          # context code used for new keys, e.g. PLAT; null until chosen

git:
  base_branch: main
  branch_prefixes: [feature, bugfix, hotfix, refactor, spike, docs, test]
  commit_convention: conventional

limits:
  max_iterations: 5
  max_review_rounds: 2
  max_diff_lines: 400        # production code; the hard ceiling counts tests too
  max_diff_lines_hard: 800
  max_task_minutes: 30
  max_cost_usd: null         # only meaningful with an API key
  max_tasks_per_window: 3    # Claude Code Pro usage window

models:                      # unset: the runner's default; reviewer must differ from coder
  coder: null
  tester: null
  reviewer: null
  pr_writer: null

tests:                       # which files are tests, and how to prove a new one fails (ADLC-015)
  paths: []                  # globs; the red phase refuses to run until a profile or repo sets them
  red: null                  # one test file, e.g. `pytest {file}`; null runs the `test` command
  failure_markers: []        # text a real failure prints, to tell it from a build or import error

dod: {}                      # name: command, filled in by a stack profile

protected:                   # globs that always escalate (FR-41); a stack profile adds to these
  - ".github/**"
  - ".adlc/**"
  - "**/pyproject.toml"
  - "**/package.json"
  - "**/package-lock.json"
  - "**/requirements*.txt"
  - "**/*.csproj"
  - "**/go.mod"
  - "**/go.sum"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - "**/pom.xml"
  - "**/build.gradle*"
  - "**/Gemfile"
  - "**/Gemfile.lock"
  - "**/Pipfile*"
  - "**/poetry.lock"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/migrations/**"
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/secrets*"
protected_extra: []

merge:
  auto_merge: false          # a profile may not turn this on; adlc trust does, per repo
  required_checks: []
  method: squash
  trust_after: 3         # hand-approved merges before `adlc trust` turns auto_merge on

guardrails:                  # enforced by the orchestrator, not left to the model (FR-15)
  coder_paths: []            # globs the Coder may change; empty means anything not protected
  allowed_commands: []       # if set, the only shell commands an agent may run (prefixes)
  forbidden_commands:        # no network, installs, publishing or privilege (FR-17)
    - curl
    - wget
    - ssh
    - scp
    - sftp
    - nc
    - ncat
    - telnet
    - ftp
    - sudo
    - su
    - gh
    - git push
    - git pull
    - git fetch
    - git clone
    - git remote
    - pip install
    - pip3 install
    - npm install
    - npm i
    - yarn add
    - pnpm add
    - dotnet add
    - dotnet restore
    - nuget install

scrub:                       # removed from prompts and logs (FR-16)
  pan: true                  # card numbers: 13 to 19 digits that pass the Luhn check
  patterns: []               # extra regular expressions for personal data

methods: {}
